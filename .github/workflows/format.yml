name: Format Nix

on:
  push:
    branches:
      - main

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - run: git pull
      - run: nix shell nixpkgs#nixfmt --command bash -c "find . -name '*.nix' -exec nixfmt {} +"
      - run: |
          git config user.name "vertibtw"
          git config user.email "279445040+vertibtw@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "format"
          git push
